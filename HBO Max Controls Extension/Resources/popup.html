<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/hbo-controls.svg" alt="">
        <div class="title-wrap">
          <span>HBO Max Controls</span>
          <span class="version-tag">v1.6.0</span>
        </div>
      </header>

      <section class="btn-group">
        <button data-command="seek-back"><strong>−0.5 s</strong><kbd>⌥⌘,</kbd></button>
        <button data-command="seek-forward"><strong>+0.5 s</strong><kbd>⌥⌘.</kbd></button>
        <button class="next" data-command="next-episode"><strong>Next episode</strong><kbd>⌥N</kbd></button>
      </section>

      <section class="settings-group">
        <label class="toggle">
          <input id="auto-next" type="checkbox">
          <span>Start next episode automatically</span>
        </label>

        <div class="timer-block">
          <div class="timer-label">😴 Sleep Timer</div>
          <div id="sleep-timer-options" class="option-grid" role="group" aria-label="Sleep Timer">
            <button type="button" class="pill" data-minutes="0" aria-pressed="false">Off</button>
            <button type="button" class="pill" data-minutes="15" aria-pressed="false">15m</button>
            <button type="button" class="pill" data-minutes="30" aria-pressed="false">30m</button>
            <button type="button" class="pill" data-minutes="45" aria-pressed="false">45m</button>
            <button type="button" class="pill" data-minutes="60" aria-pressed="false">60m</button>
            <button type="button" class="pill" data-minutes="90" aria-pressed="false">90m</button>
            <button type="button" class="pill" data-minutes="120" aria-pressed="false">120m</button>
            <label class="custom-pill" for="sleep-timer-custom">
              <input id="sleep-timer-custom" type="number" min="1" max="600" inputmode="numeric" placeholder="…" aria-label="Custom sleep timer in minutes">
              <span>m</span>
            </label>
          </div>
        </div>
        <div id="sleep-timer-status" class="timer-status hidden">
          <span id="sleep-timer-countdown">⏱ --:--</span>
          <button id="cancel-sleep-timer" type="button" class="small-btn">Stop</button>
        </div>

        <div class="timer-block">
          <div class="timer-label">💤 Awake Check</div>
          <div id="awake-check-options" class="option-grid" role="group" aria-label="Awake Check">
            <button type="button" class="pill" data-minutes="0" aria-pressed="false">Off</button>
            <button type="button" class="pill" data-minutes="5" aria-pressed="false">5m</button>
            <button type="button" class="pill" data-minutes="15" aria-pressed="false">15m</button>
            <button type="button" class="pill" data-minutes="30" aria-pressed="false">30m</button>
            <button type="button" class="pill" data-minutes="60" aria-pressed="false">60m</button>
            <button type="button" class="pill" data-minutes="90" aria-pressed="false">90m</button>
            <label class="custom-pill span-2" for="awake-check-custom">
              <input id="awake-check-custom" type="number" min="1" max="600" inputmode="numeric" placeholder="Custom" aria-label="Custom awake check in minutes">
              <span>m</span>
            </label>
          </div>
        </div>
      </section>
      <div id="status" class="status">Connecting …</div>
    </main>
  </body>
</html>
