<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/hbo-controls.svg" alt="">
        <div class="title-wrap">
          <span>HBO Max Controls</span>
          <span class="version-tag">v1.4.0</span>
        </div>
      </header>

      <section class="btn-group">
        <button data-command="seek-back"><strong>−0,5 s</strong><kbd>⌥⌘,</kbd></button>
        <button data-command="seek-forward"><strong>+0,5 s</strong><kbd>⌥⌘.</kbd></button>
        <button class="next" data-command="next-episode"><strong>Nächste Folge</strong><kbd>⌥N</kbd></button>
      </section>

      <section class="settings-group">
        <label class="toggle">
          <input id="auto-next" type="checkbox">
          <span>Nächste Folge automatisch starten</span>
        </label>

        <div class="field-row">
          <label for="sleep-timer-select">😴 Sleep Timer</label>
          <select id="sleep-timer-select">
            <option value="0">Aus</option>
            <option value="1">1 Min. (Debug)</option>
            <option value="15">15 Min.</option>
            <option value="30">30 Min.</option>
            <option value="45">45 Min.</option>
            <option value="60">60 Min. (1h)</option>
            <option value="90">90 Min.</option>
            <option value="120">120 Min. (2h)</option>
          </select>
        </div>
        <div id="sleep-timer-status" class="timer-status hidden">
          <span id="sleep-timer-countdown">⏱ --:--</span>
          <button id="cancel-sleep-timer" class="small-btn">Stoppen</button>
        </div>

        <div class="field-row">
          <label for="awake-check-select">💤 Wach-Check</label>
          <select id="awake-check-select">
            <option value="0">Aus</option>
            <option value="1">1 Min. (Debug)</option>
            <option value="5">5 Min.</option>
            <option value="15">15 Min.</option>
            <option value="30">30 Min.</option>
            <option value="60">60 Min. (Standard)</option>
            <option value="90">90 Min.</option>
          </select>
        </div>
      </section>
      <div id="status" class="status">Verbinde …</div>
    </main>
  </body>
</html>
